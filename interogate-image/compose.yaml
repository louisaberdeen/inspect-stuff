# Air-gapped agent sandbox, hardened.
# Build phase (has internet) bakes content via the MULTI-STAGE Dockerfile, so the
# final image ships only the content — no git/curl/apt/pip for the model to use.
# Runtime has no network and reduced privileges: connectivity AND capability are
# both removed (defense in depth), so a single misconfiguration can't open the box.
services:
  default:
    build:
      context: .
      dockerfile: Dockerfile.multistage   # builder downloads; final image gets only content
    command: tail -f /dev/null

    network_mode: none                     # no connectivity (primary exfil control)
    cap_drop: [ALL]                        # drop all Linux capabilities
    security_opt: ["no-new-privileges:true"]  # can't gain privileges via setuid
    pids_limit: 512                        # bound fork-bomb / resource abuse
    cpus: 2.0
    mem_limit: 2g
    # NOT privileged, NO docker.sock mount, NO host networking — never for a
    # sandbox meant to isolate an agent.
